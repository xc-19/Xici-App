name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 固定用 22.04，绝不用最新的 24.04，避开系统抽风

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: |
          mv app_mobile.py main.py
          flet build apk . --project "Xici" --product "你好，汐辞" --yes --android-licenses

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xici-APK
          path: build/apk/*.apk
