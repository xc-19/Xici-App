name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 【核心修复】使用官方 Action 自动配置 Android 环境并接受许可
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Flet
        run: pip install flet

      # 强制签署协议（防止再次卡住）
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          mv app_mobile.py main.py
          flet build apk . --project "Xici" --product "你好，汐辞" --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xici-APK
          path: build/apk/*.apk
